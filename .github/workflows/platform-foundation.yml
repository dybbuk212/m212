name: Platform foundation checks

on:
  pull_request:
    paths:
      - "backend/**"
      - "supabase/**"
      - "docs/**"
      - ".github/workflows/platform-foundation.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "supabase/**"
      - "docs/**"
      - ".github/workflows/platform-foundation.yml"

permissions:
  contents: read

jobs:
  backend-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
