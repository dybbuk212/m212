name: M212 dependency security
on:
  push:
    paths: ["source/package.json", "source/package-lock.json", ".github/workflows/dependency-security.yml"]
  pull_request:
    paths: ["source/package.json", "source/package-lock.json", ".github/workflows/dependency-security.yml"]
jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ls vitest @vitest/mocker tinypool
      - run: npm audit
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
